name: Release package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - terra-graphs
          - terra-graphs-react
          - terra-graphs-react-native
      release-type:
        description: "patch | minor | major | prepatch | preminor | premajor | prerelease"
        required: true
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve workspace directory
        id: pkg
        run: |
          case "${{ inputs.package }}" in
            terra-graphs)       echo "dir=packages/core"  >> "$GITHUB_OUTPUT" ;;
            terra-graphs-react) echo "dir=packages/react" >> "$GITHUB_OUTPUT" ;;
            terra-graphs-react-native) echo "dir=packages/react-native" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown package ${{ inputs.package }}" >&2; exit 1 ;;
          esac

      - name: Git configuration
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      # Tags are namespaced by package so the two can be released independently.
      - name: Bump version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          if [[ "${{ inputs.release-type }}" == pre* ]]; then
            NEW_VERSION=$(npm --no-git-tag-version --preid=beta version "${{ inputs.release-type }}")
            echo "RELEASE_TAG=beta" >> "$GITHUB_ENV"
          else
            NEW_VERSION=$(npm --no-git-tag-version version "${{ inputs.release-type }}")
            echo "RELEASE_TAG=latest" >> "$GITHUB_ENV"
          fi
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${{ inputs.package }}@${NEW_VERSION#v}" >> "$GITHUB_ENV"

      - name: Update changelog
        uses: superfaceai/release-changelog-action@v2
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: release

      - name: Commit and tag
        run: |
          git add CHANGELOG.md "${{ steps.pkg.outputs.dir }}/package.json" package-lock.json
          git commit -m "chore: release ${{ env.TAG }}"
          git tag "${{ env.TAG }}"
          git push origin HEAD --tags

      - id: changelog
        uses: superfaceai/release-changelog-action@v2
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: read

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ startsWith(inputs.release-type, 'pre') }}

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public --tag "${RELEASE_TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_ACCESS_TOKEN }}
