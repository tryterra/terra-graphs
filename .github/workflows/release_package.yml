name: Release package

# Publishes via npm trusted publishing (OIDC) — no stored token. Same mechanism
# as terra-react; see its release_package.yml.
#
# Requires a Trusted Publisher registered on npmjs.com for EACH package, all
# pointing at org `tryterra`, repo `terra-graphs`, workflow
# `release_package.yml`:
#     terra-graphs · terra-graphs-react · terra-graphs-react-native
# Without it npm answers 404 on PUT, which reads as "no such package" but means
# "this workflow may not publish it".

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - terra-graphs
          - terra-graphs-react
          - terra-graphs-react-native
      release-type:
        description: "as-is (publish the version in package.json) | patch | minor | major | prepatch | preminor | premajor | prerelease"
        required: true
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Mint the OIDC token npm exchanges for a short-lived publish credential.
      id-token: write
      # The release commit and tag are pushed from here.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve workspace directory
        id: pkg
        run: |
          case "${{ inputs.package }}" in
            terra-graphs)       echo "dir=packages/core"  >> "$GITHUB_OUTPUT" ;;
            terra-graphs-react) echo "dir=packages/react" >> "$GITHUB_OUTPUT" ;;
            terra-graphs-react-native) echo "dir=packages/react-native" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown package ${{ inputs.package }}" >&2; exit 1 ;;
          esac

      - name: Git configuration
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      # Tags are namespaced by package so the two can be released independently.
      - name: Bump version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          if [[ "${{ inputs.release-type }}" == "as-is" ]]; then
            # A package's first release goes out at the version already decided
            # in package.json; there is nothing to bump from.
            NEW_VERSION="v$(node -p "require('./package.json').version")"
            echo "RELEASE_TAG=latest" >> "$GITHUB_ENV"
          elif [[ "${{ inputs.release-type }}" == pre* ]]; then
            NEW_VERSION=$(npm --no-git-tag-version --preid=beta version "${{ inputs.release-type }}")
            echo "RELEASE_TAG=beta" >> "$GITHUB_ENV"
          else
            NEW_VERSION=$(npm --no-git-tag-version version "${{ inputs.release-type }}")
            echo "RELEASE_TAG=latest" >> "$GITHUB_ENV"
          fi
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${{ inputs.package }}@${NEW_VERSION#v}" >> "$GITHUB_ENV"

      - name: Update changelog
        uses: superfaceai/release-changelog-action@v2
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: release

      # npm first: it is the step that cannot be undone. Tagging ahead of it
      # once left the repo announcing a release that never reached the registry.
      # No token: the credential is minted from the id-token permission above.
      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public --tag "${RELEASE_TAG}"

      - name: Commit and tag
        run: |
          git add CHANGELOG.md "${{ steps.pkg.outputs.dir }}/package.json" package-lock.json
          # An as-is release bumps nothing, so there may be nothing staged —
          # that must not abort the tag.
          git diff --cached --quiet || git commit -m "chore: release ${{ env.TAG }}"
          git tag "${{ env.TAG }}"
          git push origin HEAD --tags

      - id: changelog
        uses: superfaceai/release-changelog-action@v2
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: read

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ startsWith(inputs.release-type, 'pre') }}
